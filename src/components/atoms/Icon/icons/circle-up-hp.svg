<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Thicker Circular Outer Border -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#222222" stroke-width="14" />

  <g transform="translate(100, 108)">
    <!-- Scaled Up & More Distinct Arrow Structure -->
    <path d="M 0,-76 
             L 52,-20 
             L 22,-20 
             L 20,52 
             L -20,52 
             L -22,-20 
             L -52,-20 
             Z" 
          fill="#ffffff" 
          stroke="#222222" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Cute Face Details (Adjusted for Arrow Head) -->
    <!-- Left Eye with Monocle Ring -->
    <circle cx="-12" cy="-30" r="5" fill="#222222" />
    <circle cx="-12" cy="-30" r="7.5" fill="none" stroke="#222222" stroke-width="2.5" />
    <line x1="-7" y1="-25" x2="-3" y2="-20" stroke="#222222" stroke-width="2.5" />

    <!-- Right Eye -->
    <circle cx="12" cy="-30" r="5" fill="#222222" />

    <!-- Cute Mouth -->
    <path d="M -7,-18 Q -3.5,-13 0,-18 Q 3.5,-13 7,-18" 
          fill="none" 
          stroke="#222222" 
          stroke-width="3" 
          stroke-linecap="round" />

    <!-- Character Spots -->
    <circle cx="0" cy="-2" r="7.5" fill="#222222" />
    <circle cx="-9" cy="18" r="5" fill="#222222" />
    <circle cx="8" cy="24" r="6" fill="#222222" />
    <circle cx="-2" cy="40" r="7.5" fill="#222222" />
  </g>
</svg>
